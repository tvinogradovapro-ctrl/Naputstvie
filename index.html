<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Какой из стилей Hoff вам ближе?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f8f4ed;
            min-height: 100vh;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        .quiz-container {
            max-width: 860px;
            width: 100%;
            max-height: 95vh;
            background: #ffffff;
            border-radius: 32px;
            padding: 24px 32px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e3d6c9;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: 500;
            color: #6b5b4e;
            background: #f0ebe5;
            padding: 4px 14px;
            border-radius: 40px;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #3f2e22;
        }

        .decor-emojis {
            display: flex;
            gap: 10px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            color: #2e221b;
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .option-btn {
            background: #fcfbf9;
            border: 1.5px solid #e3d6c9;
            border-radius: 20px;
            padding: 14px 20px;
            text-align: left;
            font-size: 1rem;
            line-height: 1.4;
            color: #2d241e;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 400;
        }

        .option-btn:hover {
            background: #f8f4ed;
            border-color: #b8a290;
        }

        .option-btn.selected {
            background: #f0ebe5;
            border-color: #937b64;
            box-shadow: 0 0 0 2px rgba(147, 123, 100, 0.2);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: auto;
            padding-top: 12px;
        }

        .btn {
            border: none;
            background: #cdbaa8;
            color: #2a1f18;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: #9b8876;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #7f6b58;
        }

        .btn-secondary {
            background: #ece2d7;
            color: #3d2f25;
        }

        .btn-secondary:hover {
            background: #dfd1c2;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .color-choice {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 18px 0;
            width: 100%;
        }

        .color-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 12px;
            border-radius: 24px;
            background: #ffffff;
            border: 2px solid #e3d6c9;
            transition: all 0.2s ease;
            position: relative;
        }

        .color-card:hover {
            border-color: #b8a290;
            transform: translateY(-2px);
        }

        .color-card.active {
            border-color: #5f4a38;
            box-shadow: 0 0 0 2px #baa898;
        }

        .color-photo {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 16px;
            background-color: #e9dfd3;
        }

        .color-label {
            font-weight: 500;
            color: #2f231c;
            font-size: 0.9rem;
            text-align: center;
        }

        .zoom-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        .zoom-icon svg {
            width: 16px;
            height: 16px;
            stroke: #3f2e22;
            stroke-width: 2;
            fill: none;
        }

        .result-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .result-badge {
            display: inline-block;
            background: #3f2e22;
            color: #f9efe5;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .result-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2f2018;
            margin-bottom: 14px;
        }

        .result-layout {
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex: 1;
        }

        .result-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .result-image-container img {
            width: 100%;
            max-width: 480px;
            height: auto;
            max-height: 35vh;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background-color: #e9dfd3;
        }

        .result-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #3e2f26;
            background: #f8f4ed;
            padding: 16px 20px;
            border-radius: 20px;
            flex: 1;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: auto;
            padding-top: 12px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .modal-image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #f0ebe5;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #5a4a3a;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .start-screen {
            text-align: center;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .start-emoji {
            font-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }

        .start-screen h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #2f2018;
            margin-bottom: 16px;
        }

        .start-screen p {
            font-size: 1.1rem;
            color: #3e2f26;
            margin-bottom: 32px;
            max-width: 500px;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 16px;
                border-radius: 20px;
            }
            .question-text {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            .btn {
                width: 100%;
            }
            .color-choice {
                grid-template-columns: 1fr;
            }
            .color-photo {
                height: 100px;
            }
            .result-title {
                font-size: 1.4rem;
            }
            .result-image-container img {
                max-height: 25vh;
            }
            .nav-buttons, .action-buttons {
                flex-direction: column;
            }
            .start-emoji {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quizContainer"></div>

<div class="modal-overlay" id="zoomModal">
    <div class="modal-content">
        <button class="modal-close" id="closeZoomBtn">&times;</button>
        <img class="modal-image" id="zoomImage" src="" alt="Увеличенная картинка">
    </div>
</div>

<script>
    (function() {

        // =====================================================
        // 🟦 ССЫЛКИ НА КАРТИНКИ (ispring)
        // =====================================================
        // Используются напрямую в src="..." — без Base64-конвертера.
        // Это самая надёжная схема: браузер сам подгрузит картинки.
        // =====================================================
        const photoUrls = {
            C_lightBright: "https://new-acc-page-162.ispring.ru/proxy/longread/api/v2/longread/0995a8a5-de83-11f1-9ce6-6efcfbd5a370/attach/data/islru-10200415/20b511d2-de83-11f1-9ce6-6efcfbd5a370.jpg",
            C_light: "https://new-acc-page-162.ispring.ru/proxy/longread/api/v2/longread/0995a8a5-de83-11f1-9ce6-6efcfbd5a370/attach/data/islru-10200415/20e672ef-de83-11f1-9ce6-6efcfbd5a370.jpg",
            C_dark: "https://new-acc-page-162.ispring.ru/proxy/longread/api/v2/longread/0995a8a5-de83-11f1-9ce6-6efcfbd5a370/attach/data/islru-10200415/2100b623-de83-11f1-9ce6-6efcfbd5a370.jpg",
            T_light: "https://new-acc-page-162.ispring.ru/proxy/longread/api/v2/longread/0995a8a5-de83-11f1-9ce6-6efcfbd5a370/attach/data/islru-10200415/216b8e53-de83-11f1-9ce6-6efcfbd5a370.jpg",
            T_dark: "https://new-acc-page-162.ispring.ru/proxy/longread/api/v2/longread/0995a8a5-de83-11f1-9ce6-6efcfbd5a370/attach/data/islru-10200415/218de128-de83-11f1-9ce6-6efcfbd5a370.jpg",
            N_light: "https://new-acc-page-162.ispring.ru/proxy/longread/api/v2/longread/0995a8a5-de83-11f1-9ce6-6efcfbd5a370/attach/data/islru-10200415/20747cbd-de83-11f1-9ce6-6efcfbd5a370.jpg",
            N_dark: "https://new-acc-page-162.ispring.ru/proxy/longread/api/v2/longread/0995a8a5-de83-11f1-9ce6-6efcfbd5a370/attach/data/islru-10200415/209e56dd-de83-11f1-9ce6-6efcfbd5a370.jpg"
        };

        // 🟥 ИСПРАВЛЕНО: hoff.ru
        const studyLink = "https://study.hoff.ru/student/dashboard/loadCurs/2211";

        // ---------- ДАННЫЕ ТЕСТА ----------
        const questions = [
            {
                text: "Как проходит ваше любимое утро выходного дня?",
                options: [
                    { text: "Схватил кофе из кофемашины, взглянул, что нового в заметках на телефоне, включил фоновую музыку — и поехали! Всё быстро и ничего лишнего.", style: "C" },
                    { text: "Медленно, со вкусом: неспешный завтрак за большим столом, запах свежей выпечки, чай или кофе в уютной глиняной кружке, как на даче.", style: "T" },
                    { text: "Красиво накрыт стол, в руках тонкая фарфоровая чашка, хрустящий круассан — вокруг тишина, можно никуда не бежать и просто наслаждаться моментом.", style: "N" }
                ]
            },
            {
                text: "Что чаще всего звучит в ваших наушниках или дома фоном?",
                options: [
                    { text: "Что-то из инди, электронные треки или минималистичный лоу-фай — чтобы настраивать на рабочий лад.", style: "C" },
                    { text: "Акустика, немного фолка, что-то уютное и ламповое, может, любимый альбом на виниле.", style: "T" },
                    { text: "Джаз, неоклассика или красивые вокальные партии с богатыми аранжировками — музыка для расслабленного вечера.", style: "N" }
                ]
            },
            {
                text: "Какая книга будет ждать вас к вечеру рядом с кроватью?",
                options: [
                    { text: "Новенькая книга по саморазвитию, что-нибудь о городах будущего или биографии крутых предпринимателей.", style: "C" },
                    { text: "Тёплая проза, добрые семейные истории, сборник уютных рецептов или книги про сад и рукоделие.", style: "T" },
                    { text: "Роман о прошлом, психологическая драма или шикарный альбом по искусству.", style: "N" }
                ]
            },
            {
                text: "Какая картина заставит вас задержаться у неё в галерее?",
                options: [
                    { text: "Абстракция, современный постер, четкие графичные линии.", style: "C" },
                    { text: "Лес, поля, тёплый деревенский сюжет — родное и естественное, будто с картинки из детства.", style: "T" },
                    { text: "Портреты в духе классики, светотень, богатая композиция и детали, от которых сложно оторваться.", style: "N" }
                ]
            },
            {
                text: "Какой предмет обязательно должен быть дома, иначе «неуютно»?",
                options: [
                    { text: "Умные гаджеты, аккуратные горшки с растениями, регулировка света под настроение.", style: "C" },
                    { text: "Вещи с «ремесленной душой»: плетёные корзины, керамика ручной работы, подушки с цветами.", style: "T" },
                    { text: "Стильные зеркала, чуть-чуть золота или серебра, симметрия во всём.", style: "N" }
                ]
            },
            {
                text: "Что самое главное для вас в интерьере?",
                options: [
                    { text: "Удобство и простота, минимум лишнего, всё по делу и на своих местах.", style: "C" },
                    { text: "Основательность, тепло, простота — чтобы было место для отдыха и встреч с близкими.", style: "T" },
                    { text: "Элегантность, плавные линии, гармония и классика в современном прочтении.", style: "N" }
                ]
            },
            {
                text: "Как вы предпочитаете проводить свободное время?",
                options: [
                    { text: "Исследую города, ищу новинки в музеях, зависаю в стильных кофейнях.", style: "C" },
                    { text: "Еду на дачу, гуляю в лесу или просто отдыхаю на природе.", style: "T" },
                    { text: "Хожу в театр, на выставки, устраиваю ужины в красивых ресторанах и кафе.", style: "N" }
                ]
            }
        ];

        // ---------- СОСТОЯНИЕ ----------
        let screen = 'start';
        let currentQuestionIndex = 0;
        let answers = new Array(questions.length).fill(null);
        let selectedTone = null;
        let dominantStyle = null;

        const container = document.getElementById('quizContainer');
        const zoomModal = document.getElementById('zoomModal');
        const zoomImage = document.getElementById('zoomImage');
        const closeZoomBtn = document.getElementById('closeZoomBtn');

        function openZoom(src) {
            zoomImage.src = src;
            zoomModal.classList.add('active');
        }

        function closeZoom() {
            zoomModal.classList.remove('active');
        }

        closeZoomBtn.addEventListener('click', closeZoom);
        zoomModal.addEventListener('click', (e) => {
            if (e.target === zoomModal) closeZoom();
        });

        // Прямая подстановка ссылки — без Base64
        function getPhoto(key) {
            return photoUrls[key] || '';
        }

        function render() {
            if (screen === 'start') {
                renderStartScreen();
            } else if (screen === 'quiz') {
                renderQuestion();
            } else if (screen === 'toneChoice') {
                renderToneChoice();
            } else if (screen === 'final') {
                renderFinalScreen();
            }
        }

        function renderStartScreen() {
            container.innerHTML = `
                <div class="start-screen fade-in">
                    <div class="start-emoji">🛋️ 🖼️ ☕</div>
                    <h2>Какой из стилей Hoff вам ближе?</h2>
                    <p>Ответьте на 7 простых вопросов о привычках, хобби и эстетических предпочтениях — и узнайте, какой стиль подходит именно вам.</p>
                    <button class="btn btn-primary" id="startBtn" style="width: auto; padding: 16px 40px;">Начать тест</button>
                </div>
            `;

            document.getElementById('startBtn').addEventListener('click', () => {
                screen = 'quiz';
                currentQuestionIndex = 0;
                answers = new Array(questions.length).fill(null);
                selectedTone = null;
                dominantStyle = null;
                render();
            });
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const selected = answers[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;

            let html = `
                <div class="quiz-header">
                    <div class="progress-indicator">
                        <span class="progress-text">Вопрос ${currentQuestionIndex + 1} из ${questions.length}</span>
                    </div>
                    <div class="decor-emojis">🛋️ 🖼️ ☕</div>
                </div>
                <div class="question-text">${q.text}</div>
                <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                const isSelected = selected === opt.style;
                html += `
                    <button class="option-btn ${isSelected ? 'selected' : ''}" data-style="${opt.style}" data-idx="${idx}">
                        ${opt.text}
                    </button>
                `;
            });

            html += `</div>`;

            html += `<div class="nav-buttons">`;
            if (currentQuestionIndex > 0) {
                html += `<button class="btn btn-secondary" id="prevBtn">Назад</button>`;
            } else {
                html += `<span></span>`;
            }

            if (isLast) {
                html += `<button class="btn btn-primary" id="finishBtn" ${!selected ? 'disabled' : ''}>Показать результат</button>`;
            } else {
                html += `<button class="btn btn-primary" id="nextBtn" ${!selected ? 'disabled' : ''}>Далее</button>`;
            }
            html += `</div>`;

            container.innerHTML = html;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    answers[currentQuestionIndex] = btn.dataset.style;
                    renderQuestion();
                });
            });

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.addEventListener('click', () => { if (answers[currentQuestionIndex]) { currentQuestionIndex++; render(); } });

            const prevBtn = document.getElementById('prevBtn');
            if (prevBtn) prevBtn.addEventListener('click', () => { currentQuestionIndex--; render(); });

            const finishBtn = document.getElementById('finishBtn');
            if (finishBtn) {
                finishBtn.addEventListener('click', () => {
                    if (answers[currentQuestionIndex]) {
                        const counts = { C: 0, T: 0, N: 0 };
                        answers.forEach(a => { if (a) counts[a]++; });
                        if (counts.C >= counts.T && counts.C >= counts.N) dominantStyle = 'C';
                        else if (counts.T >= counts.C && counts.T >= counts.N) dominantStyle = 'T';
                        else dominantStyle = 'N';
                        
                        screen = 'toneChoice';
                        selectedTone = null;
                        render();
                    }
                });
            }
        }

        function renderToneChoice() {
            let badgeText = '';
            let cards = '';

            if (dominantStyle === 'C') {
                badgeText = 'СОВРЕМЕННЫЙ СТИЛЬ';
                cards = `
                    <div class="color-card" data-tone="C_lightBright">
                        <div class="zoom-icon" data-src="${getPhoto('C_lightBright')}">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </div>
                        <img class="color-photo" src="${getPhoto('C_lightBright')}" alt="Сканди">
                        <span class="color-label">Светлая с яркими акцентами</span>
                    </div>
                    <div class="color-card" data-tone="C_light">
                        <div class="zoom-icon" data-src="${getPhoto('C_light')}">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </div>
                        <img class="color-photo" src="${getPhoto('C_light')}" alt="Светлая">
                        <span class="color-label">Светлая</span>
                    </div>
                    <div class="color-card" data-tone="C_dark">
                        <div class="zoom-icon" data-src="${getPhoto('C_dark')}">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </div>
                        <img class="color-photo" src="${getPhoto('C_dark')}" alt="Тёмная">
                        <span class="color-label">Тёмная</span>
                    </div>
                `;
            } else if (dominantStyle === 'T') {
                badgeText = 'ТРАДИЦИОННЫЙ СТИЛЬ';
                cards = `
                    <div class="color-card" data-tone="T_light">
                        <div class="zoom-icon" data-src="${getPhoto('T_light')}">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </div>
                        <img class="color-photo" src="${getPhoto('T_light')}" alt="Светлая">
                        <span class="color-label">Светлая</span>
                    </div>
                    <div class="color-card" data-tone="T_dark">
                        <div class="zoom-icon" data-src="${getPhoto('T_dark')}">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </div>
                        <img class="color-photo" src="${getPhoto('T_dark')}" alt="Тёмная">
                        <span class="color-label">Тёмная</span>
                    </div>
                `;
            } else if (dominantStyle === 'N') {
                badgeText = 'НЕОКЛАССИЧЕСКИЙ СТИЛЬ';

                    <div class="color-card" data-tone="N_light">
                        <div class="zoom-icon" data-src="${getPhoto('N_light')}">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </div>
                        <img class="color-photo" src="${getPhoto('N_light')}" alt="Светлая">

                        <img class="color-photo" src="${getPhoto('N_dark')}" alt="Тёмная">
                        <span class="color-label">Тёмная</span>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="result-screen fade-in">
                    <div class="result-badge">${badgeText}</div>
                    <div class="result-title">Какая цветовая гамма вам ближе?</div>
                    <div class="color-choice">
                        ${cards}
                    </div>
                    <div class="nav-buttons" style="justify-content: flex-end;">
                        <button class="btn btn-primary" id="confirmColorBtn" disabled>Подтвердить выбор</button>
                    </div>
                </div>
            `;

            document.querySelectorAll('.color-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.zoom-icon')) return;
                    selectedTone = card.dataset.tone;
                    document.querySelectorAll('.color-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    document.getElementById('confirmColorBtn').disabled = false;
                });
            });

            document.querySelectorAll('.zoom-icon').forEach(icon => {
                icon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openZoom(icon.dataset.src);
                });
            });

            document.getElementById('confirmColorBtn').addEventListener('click', () => {
                if (selectedTone) {
                    screen = 'final';
                    render();
                }
            });
        }

            if (dominantStyle === 'C') {

                        badge: "СОВРЕМЕННЫЙ СВЕТЛЫЙ",

                    };
                    imageSrc = getPhoto('C_light');
                } else {
                    styleData = {
                        badge: "СОВРЕМЕННЫЙ ТЁМНЫЙ",
                        title: "Современный стиль в тёмной гамме",
                        description: "Вы цените практичность, ритм и свободу. Для вас важно, чтобы интерьер был удобным, функциональным и не перегруженным лишними деталями — ведь каждый элемент должен выполнять свою задачу. Вам близки лаконичные формы, прямые линии, а глубокая и выразительная темная и/или натуральная гамма помогает создать камерную, стильную и собранную атмосферу. Ваш идеальный дом — это современное, технологичное пространство с характером. Вам подойдет современный тёмный или современный тёмный натуральный стиль (преобладание древесных текстур и природных оттенков)."
                    };
                    imageSrc = getPhoto('C_dark');
                }
            } else if (dominantStyle === 'T') {
                if (selectedTone === 'T_light') {
                    styleData = {
                        badge: "ТРАДИЦИОННЫЙ СВЕТЛЫЙ",
                        title: "Традиционный стиль в светлой гамме",
                        description: "Ваша база — это тепло, уют и связь с природой. Вы выбираете простые формы, натуральные фактуры и детали, которые создают ощущение основательного дома. Вам близка светлая природная гамма (мягкие оттенки топленого молока, выбеленного дерева, льна и глины), рогожка, плетеные корзины и текстиль с душевным характером, наполняющие пространство воздухом и светом. Ваш дом — это светлая, тихая гавань, где легко замедлиться и отдохнуть от городской суеты."
                    };
                    imageSrc = getPhoto('T_light');
                } else {
                    styleData = {
                        badge: "ТРАДИЦИОННЫЙ ТЁМНЫЙ",
                        title: "Традиционный стиль в тёмной гамме",
                        description: "Ваша база — это тепло, уют и связь с природой. Вы выбираете простые формы, натуральные фактуры и детали, которые создают ощущение основательного дома. Вам близка глубокая природная гамма (насыщенные оттенки темной земли, глубокой хвои и обожженной глины), плотная рогожка, темное дерево, плетеные корзины и уютный текстиль с душевным характером. Ваш дом — это камерная, обволакивающая тихая гавань, где легко замедлиться и отдохнуть от городской суеты."
                    };
                    imageSrc = getPhoto('T_dark');
                }
            } else if (dominantStyle === 'N') {
                if (selectedTone === 'N_light') {
                    styleData = {
                        badge: "НЕОКЛАССИЧЕСКИЙ СВЕТЛЫЙ",
                        title: "Неоклассический стиль в светлой гамме",
                        description: "Вы любите гармонию, элегантность и современный взгляд на классику. Вам близки симметрия, плавные линии, благородные фактуры (велюр, деликатный блеск золота или серебра) и мягкая светлая гамма, которая наполняет пространство воздухом, легким сиянием и чувством простора. Вы цените эстетику, но адаптируете её под комфорт повседневной жизни — без избыточной тяжести дворцовых интерьеров, но с изысканным вкусом. Ваш дом выглядит сбалансированно, свежо, респектабельно и стильно."
                    };
                    imageSrc = getPhoto('N_light');
                } else {

                        badge: "НЕОКЛАССИЧЕСКИЙ ТЁМНЫЙ",

                <div class="result-screen fade-in">

                            <button class="btn btn-secondary" id="restartBtn">Пройти заново</button>

                        </div>
                    </div>
                </div>
            `;

            document.getElementById('restartBtn').addEventListener('click', () => {
                screen = 'start';
                currentQuestionIndex = 0;
                answers = new Array(questions.length).fill(null);
                selectedTone = null;
                dominantStyle = null;
                render();
            });
        }

        // Старт — без Base64-конвертера
        render();
    })();
</script>
