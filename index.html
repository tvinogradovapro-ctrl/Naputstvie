<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: ваш идеальный интерьерный стиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f8f4ed 0%, #efe6db 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-illustration {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 2vw;
        }

        .bg-illustration svg {
            width: clamp(160px, 24vw, 320px);
            height: auto;
            display: block;
        }

        .quiz-container {
            position: relative;
            z-index: 1;
            max-width: 860px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 36px 40px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.2s ease;
        }

        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .progress-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #6b5b4e;
            background: #e9dfd3;
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        .decor-emojis {
            display: flex;
            gap: 10px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2e221b;
            margin-bottom: 28px;
            padding-bottom: 6px;
            border-bottom: 3px dashed #d9c8b8;
            display: inline-block;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 36px;
        }

        .option-btn {
            background: #ffffffd9;
            border: 1.5px solid #e3d6c9;
            border-radius: 32px;
            padding: 18px 26px;
            text-align: left;
            font-size: 1.08rem;
            line-height: 1.5;
            color: #2d241e;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px -6px rgba(0, 0, 0, 0.08);
            display: block;
            font-weight: 400;
            letter-spacing: 0.2px;
            backdrop-filter: blur(4px);
        }

        .option-btn:hover {
            background: #fcf7f0;
            border-color: #b8a290;
            transform: translateY(-2px);
            box-shadow: 0 14px 22px -10px rgba(80, 60, 40, 0.2);
        }

        .option-btn.selected {
            background: #e6d8c9;
            border-color: #937b64;
            box-shadow: 0 0 0 3px rgba(147, 123, 100, 0.25);
            color: #1f1712;
            font-weight: 400;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .btn {
            border: none;
            background: #cdbaa8;
            color: #2a1f18;
            padding: 16px 34px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 18px -10px rgba(70, 50, 30, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #ffffff50;
            backdrop-filter: blur(4px);
            flex: 0 0 auto;
            text-decoration: none;
        }

        .btn-primary {
            background: #9b8876;
            color: #ffffff;
            box-shadow: 0 12px 22px -10px #5f4a38;
        }

        .btn-primary:hover {
            background: #7f6b58;
            transform: scale(1.01);
        }

        .btn-secondary {
            background: #ece2d7;
            color: #3d2f25;
        }

        .btn-secondary:hover {
            background: #dfd1c2;
        }

        .btn-accent {
            background: #3f2e22;
            color: #f9efe5;
            box-shadow: 0 12px 22px -10px #2a1d14;
        }

        .btn-accent:hover {
            background: #2a1d14;
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
            transform: none;
        }

        .result-screen {
            text-align: left;
        }

        .result-style-badge {
            display: inline-block;
            background: #3f2e22;
            color: #f9efe5;
            font-weight: 500;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1.05rem;
            letter-spacing: 1px;
            margin-bottom: 24px;
            box-shadow: 0 12px 18px -10px #3f2e22;
        }

        .result-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2f2018;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .result-description {
            font-size: 1.14rem;
            line-height: 1.7;
            color: #3e2f26;
            background: #f3ebe3e0;
            padding: 28px 32px;
            border-radius: 36px;
            border: 1px solid #ffffffee;
            box-shadow: 0 12px 24px -16px #00000020;
            margin-bottom: 36px;
            backdrop-filter: blur(4px);
        }

        .color-choice {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 26px 0 28px;
            flex-wrap: wrap;
        }

        .color-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 16px;
            border-radius: 32px;
            background: #ffffffb0;
            border: 2px solid transparent;
            box-shadow: 0 8px 16px -10px #00000020;
            backdrop-filter: blur(4px);
            width: 220px;
            position: relative;
        }

        .color-card:hover {
            border-color: #9b8876;
            transform: translateY(-3px);
        }

        .color-card.active {
            border-color: #5f4a38;
            background: #f5ede5;
            box-shadow: 0 0 0 3px #baa898;
        }

        .color-photo {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 14px -8px #00000030;
            border: 2px solid #ffffffcc;
            display: block;
            background-color: #e9dfd3;
        }

        .color-photo.lighten, .result-image-container img.lighten {
            filter: brightness(1.4);
        }

        .color-label {
            font-weight: 500;
            color: #2f231c;
            background: #e9dfd3c0;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.95rem;
            text-align: center;
        }

        .zoom-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: background 0.2s, transform 0.2s;
            z-index: 2;
        }

        .zoom-icon:hover {
            background: #fff;
            transform: scale(1.1);
        }

        .zoom-icon svg {
            width: 20px;
            height: 20px;
            stroke: #3f2e22;
            stroke-width: 2;
            fill: none;
        }

        .result-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 32px;
        }

        .result-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .result-image-container img {
            width: 100%;
            max-width: 600px;
            height: auto;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.25);
            background-color: #e9dfd3;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #fdfaf7;
            border-radius: 32px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        /* Обновленная кнопка закрытия (крестик) */
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #ece2d7;
            border: none;
            font-size: 2.2rem; /* Увеличенный размер крестика */
            cursor: pointer;
            color: #5a4a3a;
            line-height: 1;
            width: 44px; /* Немного больше для баланса */
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0 4px 0; /* Центровка */
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .modal-close:hover {
            background: #dfd1c2;
        }

        .modal-image {
            width: 100%;
            height: auto;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.25);
            display: block;
            background-color: #e9dfd3;
        }

        .zoom-modal .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            padding: 20px;
            background: transparent;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-modal .modal-image {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 20px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
            transform: scale(1.0);
            width: auto;
            height: auto;
        }

        .modal-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #3e2f26;
            text-align: center;
        }

        .modal-link {
            color: #7f6b58;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 3px;
            word-break: break-all;
        }

        .share-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
            position: relative;
        }

        .share-btn-main {
            background: #3f2e22;
            color: #f9efe5;
            border: none;
            padding: 16px 34px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 12px 22px -10px #2a1d14;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .share-btn-main:hover {
            background: #2a1d14;
        }

        .start-screen {
            text-align: center;
            padding: 20px 0;
        }

        .start-screen h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2f2018;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .start-screen p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #3e2f26;
            margin-bottom: 36px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .start-emoji {
            font-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fade 0.35s ease;
        }

        @keyframes fade {
            from { opacity: 0.2; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 24px 22px 28px;
                border-radius: 32px;
            }
            .question-text {
                font-size: 1.25rem;
            }
            .option-btn {
                padding: 16px 20px;
                font-size: 0.98rem;
            }
            .btn {
                padding: 14px 24px;
                font-size: 1rem;
            }
            .result-title {
                font-size: 2rem;
            }
            .result-description {
                padding: 20px;
            }
            .bg-illustration {
                opacity: 0.25;
            }
            .color-card {
                width: 100%;
            }
            .modal-content {
                padding: 24px 20px;
            }
            .start-screen h2 {
                font-size: 1.7rem;
            }
            .start-screen p {
                font-size: 1rem;
            }
            .zoom-modal .modal-content {
                padding: 10px;
            }
            .zoom-modal .modal-image {
                max-height: 80vh;
            }
            .modal-close {
                width: 38px;
                height: 38px;
                font-size: 1.8rem;
                padding-bottom: 3px;
            }
        }

        @media (max-width: 420px) {
            .nav-buttons {
                flex-direction: column-reverse;
            }
            .btn {
                width: 100%;
            }
            .quiz-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .action-buttons {
                flex-direction: column;
            }
            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="bg-illustration">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="armchairGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#cbb8a5"/>

            </linearGradient>
            <linearGradient id="lampGrad" x1="0" y1="0" x2="0" y2="1">

        </defs>
        <rect x="0" y="160" width="200" height="40" fill="#e2d4c4"/>

    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#c2ab93"/>

        </defs>
        <rect x="0" y="160" width="200" height="40" fill="#e2d4c4"/>
        <rect x="40" y="50" width="120" height="110" rx="8" fill="url(#shelfGrad)"/>

<div class="quiz-container" id="quizContainer"></div>

<!-- Модальное окно для увеличения картинки -->
<div class="modal-overlay zoom-modal" id="zoomModal">
    <div class="modal-content">
        <button class="modal-close" id="closeZoomBtn">&times;</button>
        <img class="modal-image" id="zoomImage" src="" alt="Увеличенная картинка">
    </div>
</div>

<script>
    (function() {
        // ---------- ДАННЫЕ ТЕСТА ----------
        const questions = [
            {
                text: "Как проходит ваше любимое утро выходного дня?",
                options: [
                    { text: "Схватил кофе из кофемашины, взглянул, что нового в заметках на телефоне, включил фоновую музыку — и поехали! Всё быстро и ничего лишнего.", style: "C" },
                    { text: "Медленно, со вкусом: неспешный завтрак за большим столом, запах свежей выпечки, чай или кофе в уютной глиняной кружке, как на даче.", style: "T" },
                    { text: "Красиво накрыт стол, в руках тонкая фарфоровая чашка, хрустящий круассан — вокруг тишина, можно никуда не бежать и просто наслаждаться моментом.", style: "N" }
                ]
            },
            {
                text: "Что чаще всего звучит в ваших наушниках или дома фоном?",
                options: [
                    { text: "Что-то из инди, электронные треки или минималистичный лоу-фай — чтобы настраивать на рабочий лад.", style: "C" },
                    { text: "Акустика, немного фолка, что-то уютное и ламповое, может, любимый альбом на виниле.", style: "T" },
                    { text: "Джаз, неоклассика или красивые вокальные партии с богатыми аранжировками — музыка для расслабленного вечера.", style: "N" }
                ]
            },
            {
                text: "Какая книга будет ждать вас к вечеру рядом с кроватью?",
                options: [
                    { text: "Новенькая книга по саморазвитию, что-нибудь о городах будущего или биографии крутых предпринимателей.", style: "C" },
                    { text: "Тёплая проза, добрые семейные истории, сборник уютных рецептов или книги про сад и рукоделие.", style: "T" },
                    { text: "Роман о прошлом, психологическая драма или шикарный альбом по искусству.", style: "N" }
                ]
            },
            {
                text: "Какая картина заставит вас задержаться у неё в галерее?",
                options: [
                    { text: "Абстракция, современный постер, четкие графичные линии.", style: "C" },
                    { text: "Лес, поля, тёплый деревенский сюжет — родное и естественное, будто с картинки из детства.", style: "T" },
                    { text: "Портреты в духе классики, светотень, богатая композиция и детали, от которых сложно оторваться.", style: "N" }
                ]
            },
            {
                text: "К какому пледу или обивке на диване хочется прикоснуться?",
                options: [
                    { text: "Ровная, практичная ткань, гладкий трикотаж, минимализм во всём.", style: "C" },
                    { text: "Плетёная фактура, твид, клетка — что-то тёплое, уютное, как у бабушки.", style: "T" },
                    { text: "Велюр, бархат, ткань с красивым отливом, объёмные текстуры — всё выглядит дорого и стильно.", style: "N" }
                ]
            },
            {
                text: "Какой предмет обязательно должен быть дома, иначе «неуютно»?",
                options: [
                    { text: "Умные гаджеты, аккуратные горшки с растениями, регулировка света под настроение.", style: "C" },
                    { text: "Вещи с «ремесленной душой»: плетёные корзины, керамика ручной работы, подушки с цветами.", style: "T" },
                    { text: "Стильные зеркала, чуть-чуть золота или серебра, симметрия во всём.", style: "N" }
                ]
            },
            {

            container.innerHTML = html;

                currentQuestionIndex = 0;
                answers = new Array(questions.length).fill(null);

                colorChoiceMade = false;
                selectedTone = null;
                dominantStyle = null;

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const selected = answers[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;

            let html = `
                <div class="quiz-header">
                    <div class="progress-indicator">
                        <span class="progress-text">Вопрос ${currentQuestionIndex + 1} из ${questions.length}</span>
                    </div>

                </div>
                <div class="question-text">${q.text}</div>
                <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                const isSelected = selected === opt.style;
                html += `
                    <button class="option-btn ${isSelected ? 'selected' : ''}" data-style="${opt.style}" data-idx="${idx}">
                        ${opt.text}
                    </button>
                `;
            });

            html += `</div>`;

            html += `<div class="nav-buttons">`;
            if (currentQuestionIndex > 0) {
                html += `<button class="btn btn-secondary" id="prevBtn">Назад</button>`;
            } else {
                html += `<span></span>`;
            }

            if (isLast) {
                html += `<button class="btn btn-primary" id="finishBtn" ${!selected ? 'disabled' : ''}>Показать результат</button>`;
            } else {
                html += `<button class="btn btn-primary" id="nextBtn" ${!selected ? 'disabled' : ''}>Далее</button>`;
            }
            html += `</div>`;

            container.innerHTML = html;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    answers[currentQuestionIndex] = btn.dataset.style;
                    renderQuestion();
                });
            });

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (answers[currentQuestionIndex]) {
                        currentQuestionIndex++;
                        render();
                    }
                });
            }

            const prevBtn = document.getElementById('prevBtn');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    currentQuestionIndex--;
                    render();
                });
            }

            const finishBtn = document.getElementById('finishBtn');
            if (finishBtn) {
                finishBtn.addEventListener('click', () => {
                    if (answers[currentQuestionIndex]) {
                        const counts = getCounts();
                        if (counts.C >= counts.T && counts.C >= counts.N) {
                            dominantStyle = 'C';
                        } else if (counts.T >= counts.C && counts.T >= counts.N) {
                            dominantStyle = 'T';
                        } else {
                            dominantStyle = 'N';
                        }
                        screen = 'toneChoice';
                        quizFinished = true;
                        colorChoiceMade = false;
                        selectedTone = null;
                        render();
                    }
                });
            }
        }

            const count = { C: 0, T: 0, N: 0 };

                        description: "Вы любите гармонию, элегантность и современный взгляд на классику. Вам близки симметрия, плавные линии, благородные фактуры (велюр, деликатный блеск золота или серебра) и глубокая, сдержанная темная гамма, придающая интерьеру особый драматизм, камерность и сложный характер. Вы цените эстетику, но адаптируете её под комфорт повседневной жизни — без избыточной тяжести дворцовых интерьеров, но с изысканным вкусом. Ваш дом выглядит сбалансированно, загадочно, респектабельно и стильно."
                    };
                    imageSrc = photos.N_dark;
                }
            }

            let html = `
                <div class="result-screen fade-in">
                    <div class="result-style-badge">ВАШ СТИЛЬ: ${styleData.badge}</div>
                    <div class="result-title">${styleData.title}</div>
                    <div class="result-layout">
                        <div class="result-image-container">
                            <img src="${imageSrc}" class="${isLighten ? 'lighten' : ''}" alt="${styleData.title}">
                        </div>
                        <div class="result-description">${styleData.description}</div>
                        <div class="action-buttons">
                            <button class="btn btn-secondary" id="restartBtn">Пройти заново</button>
                            <a class="btn btn-primary" href="${studyLink}" target="_blank" rel="noopener">Узнать больше о стилях Hoff</a>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            document.getElementById('restartBtn').addEventListener('click', () => {
                screen = 'start';
                currentQuestionIndex = 0;
                answers = new Array(questions.length).fill(null);
                quizFinished = false;
                colorChoiceMade = false;
                selectedTone = null;
                dominantStyle = null;
                render();
            });
        }

        // Старт
        render();
    })();
</script>
</body>
</html>
